services:
  postgres:
    image: postgres:16-alpine
    container_name: milkbucket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: milkbucket
      POSTGRES_PASSWORD: milkbucket
      POSTGRES_DB: milkbucket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milkbucket -d milkbucket"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: milkbucket-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://milkbucket:milkbucket@postgres:5432/milkbucket?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres-data:
